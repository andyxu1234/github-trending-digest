name: Deploy UI to GitHub Pages

on:
  # 每次日报/周报/月报提交后自动部署
  push:
    branches: [main]
    paths:
      - "reports/**"
      - "data/favorites.md"
      - "build_ui.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# 兼容 Node 20 action 被逐步淘汰期间的弃用告警（无实际影响，可随时删除）
env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build static site
        # build_ui.py 只用标准库，无需安装依赖
        run: python build_ui.py

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # 仓库尚未开启 Pages 时自动创建站点（需要 pages: write 权限）
          # 若已在 Settings → Pages 手动选择 "GitHub Actions"，该项会直接跳过
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
